name: Run trading engine
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run engine
        run: python engine/run.py
      - name: Commit results
        run: |
          git config user.name "arena-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "trades $(date -u +'%Y-%m-%d %H:%M')"
          git push
